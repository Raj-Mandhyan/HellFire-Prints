version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hellfire-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password_123
      POSTGRES_DB: hellfire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
